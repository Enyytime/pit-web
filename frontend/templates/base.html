<!doctype html><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>{{.Title}}</title>
<style>
body{font:15px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem}
a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}
pre{background:#f6f8fa;padding:1rem;overflow:auto;border-radius:6px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
header h2{margin:0}
header nav{display:flex;gap:1rem;align-items:center;font-size:14px}
.c{border-bottom:1px solid #ddd;padding:.6rem 0}
.m{color:#666;font-size:13px}
.bar{display:flex;gap:1rem;font-size:13px;margin:.5rem 0 1rem}
.nav{display:flex;justify-content:space-between;margin:1rem 0}
.code{counter-reset:l;white-space:pre}
.code .l{counter-increment:l}
.code .l:before{content:counter(l);display:inline-block;width:3.5em;margin-right:1em;text-align:right;color:#8b949e;user-select:none}
.diff{font:13px ui-monospace,monospace;border:1px solid #ddd;border-radius:6px;overflow:auto;margin:.5rem 0 1.5rem}
.d{white-space:pre;min-width:max-content}
.d .n{display:inline-block;width:3.2em;text-align:right;padding-right:.6em;color:#8b949e;user-select:none}
.d.a{background:#e6ffec}.d.r{background:#ffebe9}
.d .h{color:#8b949e}
.st{font:12px ui-monospace,monospace;margin-right:.4rem}
.ad{color:#1a7f37}.de{color:#cf222e}
.msg{white-space:pre-wrap}
h4{margin:1.2rem 0 .3rem;font-family:ui-monospace,monospace;font-size:14px;word-break:break-all}
.badge{font-size:11px;border:1px solid #ccc;border-radius:10px;padding:0 .5rem;color:#666;margin:0 .3rem}
.badge.pub{border-color:#1a7f37;color:#1a7f37}
form.stack{display:grid;gap:.7rem;max-width:380px;margin:1rem 0}
form.stack label{display:grid;gap:.25rem;font-size:13px;color:#666}
input,select,button{font:inherit;padding:.45rem .6rem;border:1px solid #ccc;border-radius:6px;background:transparent;color:inherit}
button{cursor:pointer;background:#0969da;border-color:#0969da;color:#fff}
button.link{background:none;border:0;color:#0969da;padding:0;font-size:inherit}
button.danger{background:none;color:#cf222e;border-color:#cf222e}
form.inline{display:inline;margin:1rem 0;display:block}
.err{border:1px solid #cf222e;background:#ffebe9;color:#82071e;padding:.6rem .8rem;border-radius:6px;margin:1rem 0}
.ok{border:1px solid #1a7f37;background:#e6ffec;color:#116329;padding:.6rem .8rem;border-radius:6px;margin:1rem 0}
.secret{font:13px ui-monospace,monospace;word-break:break-all;background:#f6f8fa;padding:.6rem;border-radius:6px;margin:.5rem 0}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{text-align:left;padding:.4rem .5rem;border-bottom:1px solid #ddd;vertical-align:middle}
section{margin:2rem 0}
h3{margin:1.2rem 0 .5rem}
@media(prefers-color-scheme:dark){
body{background:#0d1117;color:#e6edf3}pre,.secret{background:#161b22}
.c,td,th{border-color:#30363d}.m,form.stack label{color:#8b949e}a,button.link{color:#58a6ff}
.diff,input,select,.badge{border-color:#30363d}.d.a{background:#12261e}.d.r{background:#3c1618}
.ad{color:#3fb950}.de{color:#f85149}
.err{background:#3c1618;color:#ffdcd7;border-color:#8e1519}.ok{background:#12261e;color:#aff5b4;border-color:#238636}
button.danger{color:#f85149;border-color:#f85149}}
</style>
<header>
<h2><a href="/">pit</a></h2>
<nav>
{{if .User}}
<a href="/settings">{{.User.Username}}</a>
{{if .User.IsAdmin}}<a href="/admin">admin</a>{{end}}
{{if .CSRF}}<form method=post action="/logout" style="margin:0"><input type=hidden name=csrf value="{{.CSRF}}"><button class=link>log out</button></form>{{end}}
{{else}}
<a href="/login">log in</a>
{{end}}
</nav>
</header>
{{if .Err}}<div class=err>{{.Err}}</div>{{end}}
{{if .Msg}}<div class=ok>{{.Msg}}</div>{{end}}
{{block "content" .}}{{end}}
