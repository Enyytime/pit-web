<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=color-scheme content="light dark">
<title>{{.Title}}</title>
<style>
:root{
--bg:#f1f3f6;--surface:#fff;--ink:#151a21;--muted:#5c6673;--line:#dadfe6;--line-soft:#e8ecf1;
--accent:#2c44cf;--accent-ink:#fff;--accent-soft:#e7ebfc;
--add-bg:#e4f6ea;--add-ink:#17793a;--del-bg:#fce8e6;--del-ink:#b3261e;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
--serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
--mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root{
--bg:#0e1116;--surface:#151a21;--ink:#e8ecf1;--muted:#8e98a6;--line:#272e38;--line-soft:#1e242d;
--accent:#93a2ff;--accent-ink:#0e1116;--accent-soft:#1c2340;
--add-bg:#12281c;--add-ink:#4ccd7c;--del-bg:#33171a;--del-ink:#ff8a80;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font:.9em var(--mono);background:var(--accent-soft);padding:.1rem .35rem;border-radius:4px}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:54px}
.brand{font:700 20px var(--mono);letter-spacing:-.03em;color:var(--ink)}
.brand:hover{text-decoration:none}
.brand::after{content:"";display:inline-block;width:.5em;height:1em;margin-left:.12em;background:var(--accent);vertical-align:-.12em}
.top nav{display:flex;gap:1.1rem;align-items:center;font-size:14px}
.top nav a{color:var(--muted)}
.top nav a:hover{color:var(--ink)}
main{padding-bottom:4rem}

/* headings */
h1{font:600 28px/1.2 var(--serif);letter-spacing:-.01em;margin:2.2rem 0 .8rem;overflow-wrap:anywhere}
h1 a{color:inherit}
h1.path{font:600 20px/1.3 var(--mono);letter-spacing:0}
h1 .sep{color:var(--muted);font-weight:400}
h2{font:600 15px/1.3 var(--sans);margin:2.2rem 0 .55rem}
.m{color:var(--muted);font-size:13px}
section>.m{margin:.2rem 0 .8rem;max-width:68ch}
section{margin:0 0 .5rem}

/* lists: repos, branches, files */
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:.6rem;padding:.7rem .95rem;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--accent-soft)}
.row .nm{font-weight:600}
.row .m{margin-left:auto}
.files .row .nm{font:500 14px var(--mono)}
.row.dir .nm{font-weight:700}
.badge{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 .55rem;color:var(--muted)}
.badge.pub{border-color:var(--add-ink);color:var(--add-ink)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:1.1rem 1rem;color:var(--muted);margin:1rem 0}
.note{padding:.9rem 1rem;color:var(--muted);font-size:13px}

/* commit log: one rail, one dot per commit */
.log{list-style:none;margin:1.4rem 0 1rem;padding:0}
.log li{position:relative;padding:0 0 1.3rem 32px}
.log li::before{content:"";position:absolute;left:8px;top:1rem;bottom:-.35rem;width:2px;background:var(--line)}
.log li:last-child::before{display:none}
.log li::after{content:"";position:absolute;left:1px;top:.3rem;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.log li.head::after{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ttl a{color:var(--ink);font-weight:600}
.ttl a:hover{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.15rem 1rem;color:var(--muted);font-size:13px;margin-top:.15rem}
.hash{font:12.5px var(--mono);background:var(--accent-soft);color:var(--accent);padding:.05rem .45rem;border-radius:4px}
.hash.full{overflow-wrap:anywhere}
.nav{display:flex;justify-content:space-between;margin:1.4rem 0;font-size:14px}

/* commit page */
.msg{white-space:pre-wrap;color:var(--muted);margin:.2rem 0 .8rem;max-width:68ch}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin:1rem 0}
.actions .m{margin-right:.4rem}
.btn,button.ghost{display:inline-block;font:500 14px var(--sans);padding:.35rem .8rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover,button.ghost:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.sum{margin:1.6rem 0 .2rem;font-weight:600}
.file{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:.9rem 0 1.4rem;overflow:hidden}
.fh{display:flex;align-items:center;gap:.65rem;padding:.55rem .85rem;border-bottom:1px solid var(--line);background:var(--bg)}
.fp{font:600 13px var(--mono);overflow-wrap:anywhere}
.fs{margin-left:auto;font:12.5px var(--mono);white-space:nowrap}
.st{display:grid;place-items:center;flex:none;width:1.5rem;height:1.5rem;border-radius:4px;font:700 11px var(--mono)}
.sa{background:var(--add-bg);color:var(--add-ink)}
.sd{background:var(--del-bg);color:var(--del-ink)}
.sm{background:var(--accent-soft);color:var(--accent)}
.ad{color:var(--add-ink)}.de{color:var(--del-ink)}
.diff{font:12.5px/1.55 var(--mono);overflow:auto}
.d{white-space:pre;min-width:max-content}
.d .n{display:inline-block;width:3.2em;text-align:right;padding-right:.6em;color:var(--muted);opacity:.75;user-select:none}
.d .g{display:inline-block;width:1.4em;text-align:center;color:var(--muted);user-select:none}
.d.a{background:var(--add-bg)}.d.a .g{color:var(--add-ink)}
.d.r{background:var(--del-bg)}.d.r .g{color:var(--del-ink)}
.d .h{color:var(--muted)}
.d.gap{background:var(--bg)}

/* file view */
.code{counter-reset:l;white-space:pre;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.8rem 0;margin:1rem 0;overflow:auto;font:13px/1.6 var(--mono);tab-size:4}
.code .l{counter-increment:l;padding-right:1.2rem}
.code .l:before{content:counter(l);display:inline-block;width:3.6em;margin-right:1.1em;text-align:right;color:var(--muted);opacity:.7;user-select:none}

/* forms */
.card{max-width:400px;margin:3rem auto}
.card h1{font-size:24px;margin-top:0}
form.stack{display:grid;gap:.9rem;max-width:400px;margin:1rem 0}
form.stack label{display:grid;gap:.3rem;font-size:13px;font-weight:600}
input,select{font:inherit;width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input[type=hidden]{display:none}
button{font:600 14px var(--sans);padding:.55rem 1rem;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:hover{filter:brightness(1.08)}
button.link{background:none;border:0;color:var(--muted);padding:0;font:inherit;font-size:14px}
button.link:hover{color:var(--ink);filter:none;text-decoration:underline}
button.danger{background:none;border-color:var(--del-ink);color:var(--del-ink);padding:.25rem .7rem;font-weight:500}
button.ghost{font-weight:500}
form.actions{margin:1.4rem 0}
.err,.ok{border-radius:6px;padding:.65rem .9rem;margin:1.2rem 0;border-left:4px solid}
.err{background:var(--del-bg);color:var(--del-ink);border-color:var(--del-ink)}
.ok{background:var(--add-bg);color:var(--add-ink);border-color:var(--add-ink)}
.secret{font:13px var(--mono);overflow-wrap:anywhere;user-select:all;background:var(--surface);border:1px dashed var(--accent);padding:.65rem .8rem;border-radius:6px;margin:.5rem 0}

/* tables */
.tw{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto;margin:.6rem 0 1rem}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td,th{text-align:left;padding:.55rem .85rem;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}

@media(max-width:560px){
.wrap{padding:0 16px}
h1{font-size:23px;margin-top:1.6rem}
.row{flex-wrap:wrap}
.card{margin:2rem auto}
}
</style>
</head>
<body>
<header class=top><div class=wrap>
<a class=brand href="/">pit</a>
<nav>
{{if .User}}
<a href="/settings">{{.User.Username}}</a>
{{if .User.IsAdmin}}<a href="/admin">Admin</a>{{end}}
{{if .CSRF}}<form method=post action="/logout" style="margin:0"><input type=hidden name=csrf value="{{.CSRF}}"><button class=link>Log out</button></form>{{end}}
{{else}}
<a href="/login">Log in</a>
{{end}}
</nav>
</div></header>
<main class=wrap>
{{if .Err}}<div class=err role=alert>{{.Err}}</div>{{end}}
{{if .Msg}}<div class=ok role=status>{{.Msg}}</div>{{end}}
{{block "content" .}}{{end}}
</main>
</body>
</html>
